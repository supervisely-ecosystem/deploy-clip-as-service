jtype: Flow
version: '1'
with:
  port: 8000
  protocol: 'http'
  cors: True
executors:
  - name: clip_t
    uses:
      jtype: CLIPEncoder
      with:
        name: ViT-B-32::openai
      metas:
        py_modules:
          - clip_server.executors.clip_torch
    timeout_ready: 300000
    replicas: 1